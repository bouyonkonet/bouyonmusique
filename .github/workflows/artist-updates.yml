name: Publish artist updates

# Publishes artist-page updates that are marked Ready in the Airtable artist-updates base.
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so this job starts the
# Pages deploy itself (workflow_dispatch is allowed) and then confirms the live pages.
on:
  schedule:
    - cron: '30 14 * * *'  # after the morning review and the site's daily build (13:00 UTC)
    - cron: '30 1 * * *'   # after the evening review
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Test: regenerate and verify the site without applying, committing or deploying'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: artist-updates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install --quiet Pillow==12.1.1
      - name: Build-only test
        if: inputs.build_only
        working-directory: build
        run: |
          python3 generate.py
          python3 generate_en_full.py
          python3 verify_site.py
          git -C .. status --short | head -20
          echo "changed files: $(git -C .. status --short | wc -l)"
      - name: Apply, generate, verify, commit and push
        if: ${{ !inputs.build_only }}
        id: push
        run: |
          git config user.name "Bouyon Konet"
          git config user.email "spaz.don@gmail.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            git clean -fdq
            python3 build/artist_updates_publish.py apply
            count=$(python3 -c "import json;print(len(json.load(open('build/.artist_updates_applied.json'))))")
            echo "count=$count" >> "$GITHUB_OUTPUT"
            if [ "$count" = 0 ]; then echo "nothing Ready"; exit 0; fi
            (cd build && python3 generate.py && python3 generate_en_full.py && python3 verify_site.py && python3 artist_updates_publish.py check-built)
            git add -A .  # the state file is gitignored, so it is skipped
            if git diff --cached --quiet; then echo "already on main"; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
            names=$(python3 -c "import json;print(', '.join(a['name'] for a in json.load(open('build/.artist_updates_applied.json'))))")
            git commit -q -m "Artist updates $(date -u +%F): $names" -m "Published from the Airtable artist-updates base by GitHub Actions."
            if git push origin HEAD:main; then echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "main moved during the build; rebuilding on the new main (attempt $attempt)"
          done
          exit 1
      - name: Deploy site
        if: steps.push.outputs.count != '0' && steps.push.outputs.count != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Confirm live and mark Published
        if: steps.push.outputs.count != '0' && steps.push.outputs.count != ''
        run: python3 build/artist_updates_publish.py mark-published "${{ steps.push.outputs.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
